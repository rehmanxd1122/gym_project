</nav></header><main class="wrap"><h1>Become a <span>FitZone member</span></h1><p>Complete this front-end practice form. Do not enter sensitive personal details.</p><form action="#" method="get"><div class="formgrid"><label>Full name<input type="text" name="name" minlength="3" maxlength="40" required placeholder="Your name"></label><label>Email<input type="email" required placeholder="name@example.com"></label><label>Password<input type="password" minlength="8" maxlength="20" required></label><label>Date of birth<input type="date" required></label><label>Website<input type="url" placeholder="https://example.com"></label><label>Preferred time<input type="time" value="09:00"></label><label>Age<input type="number" min="16" max="80" value="20"></label><label>Favourite colour<input type="color" value="#c5ed37"></label><label>Activity level<input type="range" min="1" max="5" value="3"></label><label>Goal<select required><option value="" selected disabled>Select a goal</option><option>Build strength</option><option>Improve stamina</option><option>General fitness</option></select></label><label class="wide">About your goal<textarea rows="4"></textarea></label><label class="wide">Profile picture<input type="file" accept="image/*"></label></div><fieldset><legend>Membership</legend><label class="choice"><input type="radio" name="plan" checked> Monthly</label><label class="choice"><input type="radio" name="plan"> Yearly</label></fieldset><fieldset><legend>Interests</legend><label class="choice"><input type="checkbox"> Strength</label><label class="choice"><input type="checkbox"> Cardio</label><label class="choice"><input type="checkbox"> Group sessions</label></fieldset><label>Demo ID<input value="FITZONE-DEMO" readonly></label><label class="choice"><input type="checkbox" disabled> SMS option disabled</label><button>Submit registration</button><p>Demo only: information is not saved to a server.</p></form></main><footer>© 2026 FitZone Gym — Student Web Technologies Project</footer></body></html>
